name: steps testing

on: 
  push:
    branches: "*"

jobs:
  build-id:
    runs-on: ubuntu-latest
    steps:
      - name: sample data
        id: version_data
        run: |
          echo "version=1.2.3" >> "$GITHUB_OUTPUT"

      - name: print outputs
        run: |
          echo "build version is ${{ steps.version_data.outputs.version}}"
